name: update-autobrr-dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-autobrr-dependencies
  cancel-in-progress: false

env:
  UPDATE_BRANCH_PREFIX: deps/autobrr-go-modules

jobs:
  update:
    name: Update autobrr Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Check for existing update PR
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(
            gh pr list \
              --state open \
              --limit 100 \
              --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"${UPDATE_BRANCH_PREFIX}\")) | .number" \
            | head -n 1
          )"

          if [ -n "$existing_pr" ]; then
            echo "Existing autobrr dependency update PR: #${existing_pr}"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update dependencies
        id: update
        if: steps.existing_pr.outputs.found != 'true'
        run: |
          set -euo pipefail

          branch="${UPDATE_BRANCH_PREFIX}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          upgrade_modules=(
            "github.com/autobrr/go-bdinfo"
            "github.com/autobrr/go-mediainfo"
            "github.com/autobrr/go-qbittorrent"
            "github.com/autobrr/go-torrent"
            "github.com/autobrr/mkbrr"
            "github.com/autobrr/rls"
          )

          module_version() {
            go list -m -f '{{.Version}}' "$1"
          }

          previous_versions=()
          for module_path in "${upgrade_modules[@]}"; do
            previous_versions+=("$(module_version "$module_path")")
          done

          # @upgrade preserves a current pseudo-version when it is newer than
          # the latest release tag while still advancing to newer releases.
          go_get_args=()
          for module_path in "${upgrade_modules[@]}"; do
            go_get_args+=("${module_path}@upgrade")
          done
          go get "${go_get_args[@]}"
          go mod tidy

          if go list -m github.com/anacrolix/torrent >/dev/null 2>&1; then
            echo "github.com/anacrolix/torrent was reintroduced" >&2
            exit 1
          fi

          if git diff --quiet -- go.mod go.sum; then
            echo "No autobrr dependency updates found"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          updated_modules=()
          for index in "${!upgrade_modules[@]}"; do
            module_path="${upgrade_modules[$index]}"
            current_version="$(module_version "$module_path")"
            if [[ "${previous_versions[$index]}" != "$current_version" ]]; then
              updated_modules+=("$module_path")
            fi
          done

          if (( ${#updated_modules[@]} == 0 )); then
            echo "go.mod/go.sum changed without a managed autobrr module version change" >&2
            exit 1
          fi

          git diff -- go.mod go.sum
          git add go.mod go.sum
          git commit -m "chore(deps): update autobrr Go modules"
          git push --set-upstream origin "$branch"

          {
            echo 'updated_modules<<EOF'
            printf -- '- %s\n' "${updated_modules[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATED_MODULES: ${{ steps.update.outputs.updated_modules }}
        run: |
          body_file="$(mktemp)"
          {
            printf '%s\n\n' 'Updates autobrr Go modules without downgrading newer pseudo-versions:'
            printf '%s\n\n' "$UPDATED_MODULES"
            printf '%s\n' 'Generated by the update-autobrr-dependencies workflow.'
          } > "$body_file"

          gh pr create \
            --head "${{ steps.update.outputs.branch }}" \
            --title "chore(deps): update autobrr Go modules" \
            --body-file "$body_file"
