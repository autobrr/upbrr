name: vuln

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 */2 * *"

permissions:
  contents: read

concurrency:
  group: vuln-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.6.0
  OSV_SCANNER_VERSION: v2.4.0

jobs:
  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install monitor parser
        if: ${{ !cancelled() }}
        run: python -m pip install PyYAML==6.0.3

      - name: Test remediation monitor
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s scripts/vulnerability -v

      - name: Run OSV dependency scan
        if: ${{ !cancelled() }}
        run: |
          for attempt in 1 2 3; do
            if go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::OSV scanner installation failed after 3 attempts"
              exit 1
            fi
            echo "::warning::OSV scanner installation failed; retrying in 10 seconds (attempt $attempt/3)"
            sleep 10
          done
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile go.mod --lockfile webui/pnpm-lock.yaml

      - name: Monitor braces remediation
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OSV_SCANNER="$(go env GOPATH)/bin/osv-scanner"
          export OSV_SCANNER
          python scripts/vulnerability/monitor.py

  report_failure:
    name: Report vulnerability scan failure
    needs: vuln
    if: ${{ !cancelled() && needs.vuln.result == 'failure' }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Vulnerability scan failed"
          body="Latest failed scan or remediation-monitoring run: ${RUN_URL}. Inspect the failed step; lookup failures are monitoring failures, not evidence that no fix exists."
          issue_number="$(
            gh issue list \
              --state open \
              --search "in:title \"$title\"" \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "Vulnerability scan failed") | .number' \
            | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
