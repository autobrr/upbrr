name: vuln

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 */2 * *"

permissions:
  contents: read

concurrency:
  group: vuln-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.6.0
  OSV_SCANNER_VERSION: v2.4.0

jobs:
  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Run OSV dependency scan
        if: ${{ !cancelled() }}
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION} scan source --lockfile go.mod --lockfile webui/pnpm-lock.yaml

  report_failure:
    name: Report vulnerability scan failure
    needs: vuln
    if: ${{ !cancelled() && needs.vuln.result == 'failure' }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Vulnerability scan failed"
          body="Latest failed run: ${RUN_URL}"
          issue_number="$(
            gh issue list \
              --state open \
              --search "in:title \"$title\"" \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "Vulnerability scan failed") | .number' \
            | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
