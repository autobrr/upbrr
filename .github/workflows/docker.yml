name: docker

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          outputs: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' && format('type=docker,dest={0}/image.tar', runner.temp) || '' }}
          tags: ghcr.io/${{ github.repository }}:pr${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=docker-pr-amd64
          cache-to: type=gha,scope=docker-pr-amd64,mode=min,ignore-error=true

      - name: Upload image for publication
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: docker-pr-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish PR Docker image
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    # Keep registry credentials out of the build job; never execute the PR image.
    steps:
      - name: Download image
        uses: actions/download-artifact@v5
        with:
          name: docker-pr-image
          path: ${{ runner.temp }}/docker-pr-image

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/docker-pr-image/image.tar
          IMAGE_TAG: ghcr.io/${{ github.repository }}:pr${{ github.event.pull_request.number }}
        run: |
          docker load --input "$IMAGE_ARCHIVE"
          docker push "$IMAGE_TAG"
