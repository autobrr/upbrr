name: e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: choco install ffmpeg --version=9.0.2 --yes --no-progress

      - name: Verify E2E prerequisites and runner capacity
        run: |
          ffmpeg -version
          $system = Get-CimInstance Win32_ComputerSystem
          Write-Host ("Runner capacity: {0} logical CPUs, {1:N1} GiB RAM" -f $system.NumberOfLogicalProcessors, ($system.TotalPhysicalMemory / 1GB))

      - name: Install Playwright browser
        working-directory: webui
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run E2E
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: webui/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: webui/test-results
          if-no-files-found: ignore
