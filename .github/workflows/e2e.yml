name: e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select E2E checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: Checkout complete PR history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test E2E change selection
        run: node --test scripts/ci/e2e-scope.test.mjs

      - name: Select relevant PR changes or manual full run
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(node scripts/ci/e2e-scope.mjs "$BASE_SHA" "$HEAD_SHA")
          echo "e2e=$scope" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright E2E (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Cache FFmpeg 9.0.2
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-9.0.2
          key: ffmpeg-linux-x64-n9.0.2-39-g7adfbe40dc

      - name: Install pinned FFmpeg 9.0.2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          # shortcut: month-end archives last two years; refresh this pin before November 2028.
          # Versioned upstream build and checksum keep all shards reproducible.
          curl --fail --location --retry 3 \
            'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-9.0.tar.xz' \
            --output "$RUNNER_TEMP/ffmpeg.tar.xz"
          echo "73e29a56974ae5a651133a04584c7483b21afe941e17dc91d79814a758b608d3  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ffmpeg-9.0.2"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/ffmpeg-9.0.2"

      - name: Select FFmpeg 9.0.2
        run: echo "$RUNNER_TEMP/ffmpeg-9.0.2/bin" >> "$GITHUB_PATH"

      - name: Verify E2E prerequisites and runner capacity
        run: |
          ffmpeg_version="$(ffmpeg -version)"
          printf '%s\n' "$ffmpeg_version"
          [[ "$ffmpeg_version" == 'ffmpeg version n9.0.2-'* ]]
          printf 'Runner capacity: %s logical CPUs\n' "$(nproc)"
          free --human

      - name: Build embedded E2E application
        run: make e2e-build

      - name: Install Playwright browser
        working-directory: webui
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: pnpm --dir webui exec playwright test --shard=${{ matrix.shard }}/4 --reporter=list,html,json

      - name: Upload Playwright timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-timings-${{ matrix.shard }}
          path: webui/test-results/results.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: webui/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: webui/test-results
          if-no-files-found: ignore
