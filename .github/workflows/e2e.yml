name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: Also warm the shared E2E caches when running on main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-e2e-caches:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-e2e
        with:
          seed: "true"

  e2e:
    name: Playwright E2E (${{ matrix.shard }}/4)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test E2E change selection
        id: scope-tests
        if: matrix.shard == 1
        continue-on-error: true
        run: node --test scripts/ci/e2e-scope.test.mjs

      - name: Select E2E inputs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$(node scripts/ci/e2e-scope.mjs "$BASE_SHA" "$HEAD_SHA")" == false ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/prepare-e2e
        if: steps.scope.outputs.skip != 'true'

      - name: Prepare Linux test network isolation
        if: steps.scope.outputs.skip != 'true'
        run: |
          if ! command -v nft >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y nftables
          fi

      - name: Verify test network isolation
        if: matrix.shard == 1 && steps.scope.outputs.skip != 'true'
        run: bash scripts/ci/test-loopback.test.sh

      - name: Run E2E
        if: steps.scope.outputs.skip != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: |
          if [[ "$SHARD" == 1 ]]; then
            selection=(--grep-invert '^web-full-upload ')
          else
            selection=(--project=web-full-upload "--shard=$((SHARD - 1))/3")
          fi
          bash scripts/ci/test-loopback.sh pnpm --dir webui exec playwright test "${selection[@]}" --reporter=list,html,json

      - name: Upload Playwright timings
        if: ${{ !cancelled() && steps.scope.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-timings-${{ matrix.shard }}
          path: webui/test-results/results.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure() && steps.scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: webui/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure() && steps.scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: webui/test-results
          if-no-files-found: ignore

      - name: Report selector test failure
        if: ${{ !cancelled() && steps.scope-tests.outcome == 'failure' }}
        run: exit 1
